name: Prepare environment
description: Prepare the environment required to build Panels

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes autoconf automake gettext libtool

    - name: Setup required Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup required Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Cache Rust Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry
          ~/.cargo/git
          ./native/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('./native/**/Cargo.lock', '**/rust-toolchain') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle wrapper
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4