name: Prepare environment
description: Prepare the environment required to build Panels

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          autoconf \
          automake \
          autopoint \
          build-essential \
          cmake \
          gettext \
          libtool \
          ninja-build \
          pkg-config

    - name: Setup required Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Install required Android CMake
      shell: bash
      run: |
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.10.2.4988404"

    - name: Verify native build tools
      shell: bash
      run: |
        test -x /usr/bin/cmake
        test -x "$ANDROID_SDK_ROOT/cmake/3.10.2.4988404/bin/cmake"
        command -v autoreconf
        command -v autopoint
        command -v make
        command -v ninja
        command -v pkg-config
        /usr/bin/cmake --version

    - name: Setup required Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Cache Rust Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry
          ~/.cargo/git
          ./native/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('./native/**/Cargo.lock', '**/rust-toolchain') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle wrapper
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4