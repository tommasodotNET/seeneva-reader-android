name: Release Panels

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed universal APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify release commit
        shell: bash
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Releases must be built from a commit on master"
            exit 1
          fi

      - name: Prepare build environment
        uses: ./.github/actions/prepare_env

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            version="${REQUESTED_VERSION}"
            tag="v${version}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH format"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        shell: bash
        env:
          PANELS_KEYSTORE_BASE64: ${{ secrets.PANELS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${PANELS_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/panels.keystore"

      - name: Build release APK
        env:
          # Android Gradle uses its pinned CMake 3.10.2 installation, while Cargo's
          # native dependencies need a newer host CMake supporting --parallel.
          CMAKE: /usr/bin/cmake
          SEENEVA_VERSION_NAME: ${{ steps.version.outputs.version }}
          SEENEVA_VERSION_CODE: ${{ github.run_number }}
          SEENEVA_STORE_FILE: ${{ runner.temp }}/panels.keystore
          SEENEVA_STORE_PASS: ${{ secrets.PANELS_KEYSTORE_PASSWORD }}
          SEENEVA_KEY_ALIAS: ${{ secrets.PANELS_KEY_ALIAS }}
          SEENEVA_KEY_PASS: ${{ secrets.PANELS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease -Pseeneva.disableSplitApk --no-daemon

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Panels ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/github/release/*.apk
